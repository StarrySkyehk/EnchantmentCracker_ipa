name: Verify Swift port against Java reference

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the slow full-2^32 seed-cracker vectors"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Reference vectors (Swift vs Java)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Compile verifier
        run: |
          swiftc -O Sources/Core/Engine/*.swift verify/main.swift -o verify-check 2>&1 | tee compile.log
          exit ${PIPESTATUS[0]}

      - name: Run verification
        run: |
          ./verify-check ci/vectors/reference_vectors.json

  benchmark:
    name: Cracker benchmark
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile benchmark
        run: |
          swiftc -O Sources/Core/Engine/*.swift bench/main.swift -o /tmp/bench 2>&1 | tee bench-compile.log
          exit ${PIPESTATUS[0]}

      - name: Run benchmark
        run: /tmp/bench
