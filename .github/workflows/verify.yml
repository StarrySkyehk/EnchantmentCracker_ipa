name: Verify Swift port against Java reference

on:
  workflow_dispatch:
    inputs:
      skip_cracker:
        description: "Skip the 4 full-2^32 scans (fast: tables/calculator only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Reference vectors (Swift vs Java)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Compile verifier
        run: |
          swiftc -O -whole-module-optimization Sources/Core/Engine/*.swift verify/main.swift -o verify-check 2>&1 | tee compile.log
          exit ${PIPESTATUS[0]}

      - name: Run verification
        run: |
          if [ "${{ github.event.inputs.skip_cracker }}" = "true" ]; then
            ./verify-check ci/vectors/reference_vectors.json --skip-cracker
          else
            ./verify-check ci/vectors/reference_vectors.json
          fi

  benchmark:
    name: Cracker benchmark
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile benchmark
        run: |
          swiftc -O -whole-module-optimization Sources/Core/Engine/*.swift bench/main.swift -o /tmp/bench 2>&1 | tee bench-compile.log
          exit ${PIPESTATUS[0]}

      - name: Run benchmark
        run: /tmp/bench
